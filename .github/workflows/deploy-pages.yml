# Deploys the static HTML site to GitHub Pages on every push to main.
# For more information see: https://docs.github.com/en/pages/getting-started-with-github-pages

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  # Needed so configure-pages can auto-enable Pages on first run.
  administration: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        with:
          # Auto-enable Pages (source: GitHub Actions) if not yet enabled,
          # so the first deploy doesn't fail with "Get Pages site failed".
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
