name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Stamp version from tag
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $parts = $version.Split('.')
          while ($parts.Count -lt 4) { $parts += '0' }
          $full = ($parts -join '.')
          $file = "Properties/AssemblyInfo.cs"
          $text = Get-Content $file -Raw
          $text = $text -replace 'AssemblyVersion\("[^"]+"\)', "AssemblyVersion(`"$full`")"
          $text = $text -replace 'AssemblyFileVersion\("[^"]+"\)', "AssemblyFileVersion(`"$full`")"
          Set-Content -Path $file -Value $text -NoNewline
          Write-Output "Stamped assembly version: $full"

      - name: Prepare toolchain (Roslyn + .NET Framework refs)
        run: python bootstrap.py

      - name: Fetch Fiddler.exe reference
        run: python fetch_fiddler_ref.py

      - name: Build, verify and run behavior tests
        run: python build.py -c Release --test --no-install --fiddler-ref ".toolchain/refs/Fiddler.exe"

      - name: Package plugin
        shell: pwsh
        run: |
          $name = "FiddlerWillowLite-${{ github.ref_name }}"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item "bin/Release/FiddlerWillowLite.dll" "dist/FiddlerWillowLite.dll"
          Copy-Item "README.md" "dist/README.md"
          Copy-Item "LICENSE" "dist/LICENSE"
          Compress-Archive -Path "dist/*" -DestinationPath "$name.zip"
          Write-Output "Packaged: $name.zip"

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" `
            "FiddlerWillowLite-${{ github.ref_name }}.zip" `
            --title "${{ github.ref_name }}" `
            --generate-notes
