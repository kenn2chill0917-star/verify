name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test (Windows)
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Prepare toolchain (Roslyn + .NET Framework refs)
        run: python bootstrap.py

      - name: Fetch Fiddler.exe reference
        run: python fetch_fiddler_ref.py

      - name: Build, verify and run behavior tests
        run: python build.py -c Release --test --no-install --fiddler-ref ".toolchain/refs/Fiddler.exe"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FiddlerWillowLite-ci
          path: bin/Release/FiddlerWillowLite.dll
          if-no-files-found: error
