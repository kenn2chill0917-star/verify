<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Sheet viewer</title>
  <link rel="stylesheet" href="./lib/bootstrap/css/bootstrap.min.css">
  <script src="./lib/sheetsee.js"></script>
</head>

<body>
  <div class="container py-5">
    <h1 class="mb-4">Sheet viewer</h1>
    <p class="text-muted">
      Loads a published Google Sheet as CSV and renders it as a table, in the
      spirit of <a href="https://github.com/jlord/sheetsee.js">sheetsee.js</a>.
      Paste a sheet ID and tab gid, then load. The sheet must be shared so that
      anyone with the link can view it.
    </p>

    <form id="config" class="row g-3 align-items-end mb-4">
      <div class="col-md-6">
        <label for="sheet-id" class="form-label">Google Sheet ID</label>
        <input type="text" id="sheet-id" class="form-control"
          placeholder="e.g. 1qpyC0XzvTcKT6EISywvqESX3A0MwQoFDE8p-Bll4hfs">
      </div>
      <div class="col-md-3">
        <label for="sheet-gid" class="form-label">Tab gid</label>
        <input type="text" id="sheet-gid" class="form-control" value="0">
      </div>
      <div class="col-md-3">
        <button type="submit" class="btn btn-primary w-100">Load sheet</button>
      </div>
    </form>

    <div class="mb-3">
      <label for="search" class="form-label">Filter rows</label>
      <input type="search" id="search" class="form-control" placeholder="Type to filter…">
    </div>

    <div id="status" class="text-muted mb-2"></div>
    <div id="table"></div>
  </div>

  <script>
    (function () {
      'use strict';

      var form = document.getElementById('config');
      var idInput = document.getElementById('sheet-id');
      var gidInput = document.getElementById('sheet-gid');
      var searchInput = document.getElementById('search');
      var statusEl = document.getElementById('status');
      var tableEl = document.getElementById('table');

      var rows = [];

      function render() {
        var filtered = Sheetsee.filterRows(rows, searchInput.value);
        Sheetsee.makeTable(filtered, tableEl);
        statusEl.textContent =
          filtered.length + ' of ' + rows.length + ' row(s) shown.';
      }

      form.addEventListener('submit', function (event) {
        event.preventDefault();
        var id = idInput.value.trim();
        if (!id) {
          statusEl.textContent = 'Please enter a Google Sheet ID.';
          return;
        }
        statusEl.textContent = 'Loading…';
        tableEl.innerHTML = '';
        Sheetsee.loadSheet({ id: id, gid: gidInput.value.trim() })
          .then(function (data) {
            rows = data;
            render();
          })
          .catch(function (error) {
            rows = [];
            tableEl.innerHTML = '';
            statusEl.textContent = error.message;
          });
      });

      searchInput.addEventListener('input', function () {
        if (rows.length > 0) {
          render();
        }
      });
    })();
  </script>
</body>

</html>
